<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR Scalable Education</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>กำลังเตรียมห้องเรียนเสมือนจริง...</p>
    </div>

    <div id="scan-hint" class="hidden">
        <p>กรุณาส่องกล้องไปที่ Marker</p>
    </div>

    <div id="label-container"></div>

    <div id="popup-panel" class="popup-hidden">
        <div class="popup-content">
            <h2 id="info-title">หัวข้อ</h2>
            <hr>
            <p id="info-body">รายละเอียดเนื้อหา...</p>
            <button id="close-btn">เข้าใจแล้ว</button>
        </div>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"> <a-marker id="main-marker" type="pattern"
                url="https://raw.githubusercontent.com/jeromeetienne/AR.js/master/data/data/patt.hiro"
                smooth="true"
                smoothCount="10"
                smoothTolerance=".01"
                smoothThreshold="5">

            <a-entity id="content-anchor" scale="0 0 0"></a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script src="app.js"></script>
</body>
</html>
