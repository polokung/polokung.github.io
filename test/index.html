<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR Scalable Education</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script src="app.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

<div id="loading-screen" class="overlay">
    <div class="loader">กำลังโหลดโมเดล 3D...</div>
</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker id="dynamic-marker" type="pattern" url="">
        <a-entity id="model-container"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
</a-scene>

<div id="label-container"></div> <div id="info-popup" class="popup hidden">
    <div class="popup-content">
        <h2 id="popup-title"></h2>
        <p id="popup-desc"></p>
        <button onclick="closePopup()">ปิด</button>
    </div>
</div>

</body>
</html>
