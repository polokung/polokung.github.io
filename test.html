<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Hit Test - Model Placer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .pointer-events-auto { pointer-events: auto; }
        canvas { display: block; }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
        }

        /* เอฟเฟกต์วงกลมเป้าหมาย */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body class="bg-gray-900 text-white">

    <!-- หน้าจอตรวจสอบความเข้ากันได้และเลือกโมเดล -->
    <div id="welcome-screen" class="fixed inset-0 flex flex-col items-center justify-center bg-gray-900 z-50 p-6 text-center">
        <h1 class="text-3xl font-bold mb-2">Web AR Explorer</h1>
        <p class="text-blue-400 mb-6">เลือกโมเดลและเริ่มวางในโลกจริง</p>

        <p id="status-message" class="mb-8 text-gray-300">กำลังตรวจสอบระบบ WebXR...</p>

        <div id="model-selection" class="hidden w-full max-w-md">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="selectModel('chair')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-chair">
                    <span class="text-2xl block mb-1">🪑</span> เก้าอี้
                </button>
                <button onclick="selectModel('robot')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-robot">
                    <span class="text-2xl block mb-1">🤖</span> หุ่นยนต์
                </button>
                <button onclick="selectModel('plant')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-plant">
                    <span class="text-2xl block mb-1">🪴</span> ต้นไม้
                </button>
                <button onclick="selectModel('box')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-box">
                    <span class="text-2xl block mb-1">📦</span> กล่อง
                </button>
            </div>
            <button id="start-ar-btn" class="w-full bg-white text-gray-900 font-bold py-4 px-8 rounded-2xl shadow-xl transition-all transform hover:scale-105">
                เริ่มใช้งาน AR
            </button>
        </div>

        <div id="error-box" class="hidden p-6 bg-red-900/40 border border-red-500 rounded-2xl max-w-md">
            <p id="error-text" class="text-red-200 font-medium"></p>
            <p class="mt-2 text-sm text-gray-400">ต้องใช้งานผ่าน Chrome บน Android หรือ iOS (WebXR Viewer) ภายใต้ HTTPS</p>
        </div>
    </div>

    <!-- ส่วน Overlay ขณะอยู่ใน AR -->
    <div id="overlay">
        <div id="ar-ui" class="hidden h-full flex flex-col justify-between p-6">
            <div class="flex justify-between items-start pointer-events-auto">
                <div class="glass-morphism p-4 text-sm max-w-[200px]">
                    <p id="ar-instruction" class="font-medium text-white">เลื่อนกล้องเพื่อหาพื้นผิว...</p>
                </div>
                <button id="exit-btn" class="bg-black/50 backdrop-blur-md p-3 px-5 rounded-full text-white border border-white/20">
                    ✕ ออก
                </button>
            </div>

            <div class="flex flex-col items-center mb-10 pointer-events-auto">
                <p id="tap-hint" class="hidden mb-4 text-white/90 text-sm bg-black/40 px-4 py-2 rounded-full backdrop-blur-sm">แตะที่หน้าจอเพื่อวางวัตถุ</p>
                <button id="place-btn" class="hidden bg-white text-black font-extrabold py-5 px-12 rounded-full shadow-2xl text-xl transform active:scale-90 transition-all">
                    วางที่นี่
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let selectedModelKey = 'chair';
        let currentSession = null;

        const modelUrls = {
            chair: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/SheenChair/glTF-Binary/SheenChair.glb',
            robot: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/RobotExpressive/glTF-Binary/RobotExpressive.glb',
            plant: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb',
            box: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Box/glTF-Binary/Box.glb'
        };

        async function checkCompatibility() {
            const statusMsg = document.getElementById('status-message');
            const modelSelection = document.getElementById('model-selection');

            if ('xr' in navigator) {
                try {
                    const isSupported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (isSupported) {
                        statusMsg.classList.add('hidden');
                        modelSelection.classList.remove('hidden');
                        initThreeJS();
                    } else {
                        showError("อุปกรณ์ไม่รองรับโหมด AR");
                    }
                } catch (e) {
                    showError("ข้อผิดพลาด: " + e.message);
                }
            } else {
                showError("เบราว์เซอร์ไม่รองรับ WebXR");
            }
        }

        function showError(msg) {
            const statusMsg = document.getElementById('status-message');
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');
            if(statusMsg) statusMsg.classList.add('hidden');
            if(errorBox) errorBox.classList.remove('hidden');
            if(errorText) errorText.innerText = msg;
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(2, 5, 2);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // --- สร้างวงกลมสีขาวสำหรับระบุตำแหน่ง (Reticle) ---
            const ringGeo = new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2);
            const dotGeo = new THREE.CircleGeometry(0.02, 32).rotateX(-Math.PI / 2); // จุดกึ่งกลาง

            const mat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                opacity: 0.8,
                transparent: true,
                side: THREE.DoubleSide
            });

            reticle = new THREE.Group();
            const ring = new THREE.Mesh(ringGeo, mat);
            const dot = new THREE.Mesh(dotGeo, mat);

            reticle.add(ring);
            reticle.add(dot);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);

            window.selectModel = (key) => {
                selectedModelKey = key;
                document.querySelectorAll('.model-btn').forEach(btn => btn.classList.remove('border-white', 'bg-white/20'));
                const targetBtn = document.getElementById(`btn-${key}`);
                if (targetBtn) targetBtn.classList.add('border-white', 'bg-white/20');
            };

            window.selectModel('chair');

            document.getElementById('start-ar-btn').addEventListener('click', startAR);
            document.getElementById('place-btn').addEventListener('click', placeObject);
            document.getElementById('exit-btn').addEventListener('click', exitAR);
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        async function startAR() {
            const sessionInit = { requiredFeatures: ['hit-test'] };
            try {
                const session = await navigator.xr.requestSession('immersive-ar', sessionInit);
                currentSession = session;
                renderer.xr.setSession(session);

                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('ar-ui').classList.remove('hidden');

                session.addEventListener('select', () => {
                    if (reticle.visible) placeObject();
                });

                session.addEventListener('end', () => {
                    currentSession = null;
                    document.getElementById('welcome-screen').classList.remove('hidden');
                    document.getElementById('ar-ui').classList.add('hidden');
                });

                renderer.setAnimationLoop(render);
            } catch (e) {
                alert("ไม่สามารถเริ่ม AR ได้: " + e.message);
            }
        }

        function exitAR() {
            if (currentSession) currentSession.end();
        }

        function render(timestamp, frame) {
            if (frame && renderer && scene && camera) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        session.requestHitTestSource({ space: refSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    const placeBtn = document.getElementById('place-btn');
                    const tapHint = document.getElementById('tap-hint');
                    const instruction = document.getElementById('ar-instruction');

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);

                        placeBtn.classList.remove('hidden');
                        tapHint.classList.remove('hidden');
                        instruction.innerText = "พร้อมสำหรับวางวัตถุ";
                    } else {
                        reticle.visible = false;
                        placeBtn.classList.add('hidden');
                        tapHint.classList.add('hidden');
                        instruction.innerText = "กำลังค้นหาพื้นราบ...";
                    }
                }
                renderer.render(scene, camera);
            }
        }

        function placeObject() {
            if (reticle && reticle.visible) {
                const loader = new GLTFLoader();
                const url = modelUrls[selectedModelKey];

                const placeBtn = document.getElementById('place-btn');
                const originalText = placeBtn.innerText;

                placeBtn.disabled = true;
                placeBtn.innerText = "กำลังโหลด...";

                loader.load(url, (gltf) => {
                    const model = gltf.scene;
                    reticle.matrix.decompose(model.position, model.quaternion, model.scale);

                    if (selectedModelKey === 'chair') model.scale.set(0.5, 0.5, 0.5);
                    if (selectedModelKey === 'plant') model.scale.set(4, 4, 4);
                    if (selectedModelKey === 'robot') model.scale.set(0.2, 0.2, 0.2);
                    if (selectedModelKey === 'box') model.scale.set(0.1, 0.1, 0.1);

                    scene.add(model);

                    placeBtn.disabled = false;
                    placeBtn.innerText = originalText;
                }, undefined, (e) => {
                    placeBtn.disabled = false;
                    placeBtn.innerText = "ลองใหม่";
                });
            }
        }

        window.addEventListener('load', checkCompatibility);
    </script>
</body>
</html>
