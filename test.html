<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Hit Test - Model Placer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- vConsole สำหรับ Debug บนมือถือ -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>var vConsole = new VConsole();</script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #ui-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; display: none; width: 90%; max-width: 400px; }
        #info-text { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 100; text-align: center; width: 80%; pointer-events: none; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="info-text">กำลังเตรียมระบบ Web AR...</div>

    <!-- หน้าจอเลือกโมเดล -->
    <div id="welcome-screen" class="fixed inset-0 flex flex-col items-center justify-center bg-gray-900 z-[1000] p-6 text-center">
        <h1 class="text-3xl font-bold mb-4 text-white">Web AR Explorer</h1>
        <p class="text-gray-400 mb-8">เลือกโมเดลที่ต้องการ แล้วกดปุ่มเริ่ม AR</p>

        <div class="grid grid-cols-2 gap-4 mb-8 w-full max-w-md">
            <button onclick="selectModel('chair')" class="model-btn p-4 glass rounded-2xl border-2 border-transparent text-white" id="btn-chair">
                <span class="text-2xl block">🪑</span> เก้าอี้
            </button>
            <button onclick="selectModel('robot')" class="model-btn p-4 glass rounded-2xl border-2 border-transparent text-white" id="btn-robot">
                <span class="text-2xl block">🤖</span> หุ่นยนต์
            </button>
            <button onclick="selectModel('plant')" class="model-btn p-4 glass rounded-2xl border-2 border-transparent text-white" id="btn-plant">
                <span class="text-2xl block">🥑</span> อะโวคาโด
            </button>
            <button onclick="selectModel('box')" class="model-btn p-4 glass rounded-2xl border-2 border-transparent text-white" id="btn-box">
                <span class="text-2xl block">📦</span> กล่อง
            </button>
        </div>
        <div id="ar-button-container"></div>
    </div>

    <!-- UI ปุ่มวางวัตถุ ขณะอยู่ใน AR -->
    <div id="ui-container" class="pointer-events-none">
        <div class="flex flex-col items-center gap-4 pointer-events-auto">
            <button id="place-button" class="w-full bg-blue-600 text-white font-bold py-4 px-8 rounded-full shadow-2xl text-lg active:scale-95 transition-transform">
                วางวัตถุตรงนี้
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let models = {};
        let selectedKey = 'chair';

        // ปรับปรุง URL ให้ถูกต้องตามโครงสร้างของ Three.js dev branch
        const modelUrls = {
            chair: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/SheenChair.glb',
            robot: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
            duck: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb',
            box: 'https://github.com/KhronosGroup/glTF-Sample-Models/raw/d7a3cc8e51d7c573771ae77a57f16b0662a905c6/2.0/Box/glTF-Binary/Box.glb'
        };

        const infoText = document.getElementById('info-text');
        const uiContainer = document.getElementById('ui-container');
        const placeButton = document.getElementById('place-button');
        const loader = new GLTFLoader();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const arButton = ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            document.getElementById('ar-button-container').appendChild(arButton);

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            loadAllModels();

            placeButton.addEventListener('click', () => {
                if (reticle.visible) {
                    const targetModel = models[selectedKey];
                    if (targetModel) {
                        const modelCopy = targetModel.clone();
                        modelCopy.position.setFromMatrixPosition(reticle.matrix);

                        // ปรับสเกลโมเดลให้เหมาะสม
                        if (selectedKey === 'chair') modelCopy.scale.set(0.5, 0.5, 0.5);
                        else if (selectedKey === 'plant') modelCopy.scale.set(8, 8, 8);
                        else if (selectedKey === 'robot') modelCopy.scale.set(0.15, 0.15, 0.15);
                        else if (selectedKey === 'box') modelCopy.scale.set(0.1, 0.1, 0.1);

                        scene.add(modelCopy);
                        infoText.innerText = "วางสำเร็จ!";
                    } else {
                        console.warn("Model not ready, placing fallback cube.");
                        const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                        const material = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
                        const cube = new THREE.Mesh(geometry, material);
                        cube.position.setFromMatrixPosition(reticle.matrix);
                        scene.add(cube);
                        infoText.innerText = "วางวัตถุสำรอง (โมเดลยังโหลดไม่เสร็จ)";
                    }
                    setTimeout(() => { if (renderer.xr.isPresenting) infoText.innerText = "ส่องหาพื้นเพื่อวางต่อ"; }, 2000);
                }
            });

            renderer.xr.addEventListener('sessionstart', () => {
                uiContainer.style.display = 'block';
                document.getElementById('welcome-screen').style.display = 'none';
                infoText.innerText = "กำลังหาพื้นผิว...";
            });

            renderer.xr.addEventListener('sessionend', () => {
                uiContainer.style.display = 'none';
                document.getElementById('welcome-screen').style.display = 'flex';
                infoText.innerText = "ออกจากโหมด AR";
            });

            window.addEventListener('resize', onWindowResize);
        }

        function createFallbackModel(key) {
            let geometry;
            let material = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });

            if (key === 'robot') geometry = new THREE.CylinderGeometry(0.05, 0.05, 0.2, 32);
            else if (key === 'chair') geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
            else geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);

            return new THREE.Mesh(geometry, material);
        }

        async function loadAllModels() {
            const keys = Object.keys(modelUrls);
            keys.forEach(key => {
                console.log(`Fetching model: ${key} from ${modelUrls[key]}`);
                loader.load(modelUrls[key],
                    (gltf) => {
                        models[key] = gltf.scene;
                        console.log(`Success: ${key} loaded.`);
                    },
                    undefined,
                    (err) => {
                        console.error(`Failed to load ${key}, using placeholder.`, err);
                        models[key] = createFallbackModel(key);
                    }
                );
            });
        }

        window.selectModel = (key) => {
            selectedKey = key;
            document.querySelectorAll('.model-btn').forEach(btn => btn.classList.remove('border-blue-500', 'bg-blue-600/30'));
            const btn = document.getElementById(`btn-${key}`);
            if (btn) btn.classList.add('border-blue-500', 'bg-blue-600/30');
            console.log("Model Selected:", key);
        };

        window.selectModel('chair');

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        session.requestHitTestSource({ space: refSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                            infoText.innerText = "พร้อมวางวัตถุ";
                        }
                    } else {
                        reticle.visible = false;
                        if (renderer.xr.isPresenting) infoText.innerText = "กำลังสแกนหาพื้น...";
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
