<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Hit Test - Model Placer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เพิ่ม vConsole สำหรับ Debug บนมือถือ -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
        // เริ่มต้นการทำงานของ vConsole
        var vConsole = new VConsole();
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .pointer-events-auto { pointer-events: auto; }
        canvas { display: block; }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body class="bg-gray-900 text-white">

    <!-- หน้าจอตรวจสอบความเข้ากันได้และเลือกโมเดล -->
    <div id="welcome-screen" class="fixed inset-0 flex flex-col items-center justify-center bg-gray-900 z-50 p-6 text-center">
        <h1 class="text-3xl font-bold mb-2 text-white">Web AR Explorer Pro</h1>
        <p class="text-blue-400 mb-6 font-medium">สัมผัสประสบการณ์วางวัตถุเสมือนจริงบนพื้น</p>

        <p id="status-message" class="mb-8 text-gray-300">กำลังตรวจสอบระบบ WebXR...</p>

        <div id="model-selection" class="hidden w-full max-w-md">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="selectModel('chair')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-chair">
                    <span class="text-3xl block mb-1">🪑</span> เก้าอี้
                </button>
                <button onclick="selectModel('robot')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-robot">
                    <span class="text-3xl block mb-1">🤖</span> หุ่นยนต์
                </button>
                <button onclick="selectModel('plant')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-plant">
                    <span class="text-3xl block mb-1">🪴</span> ต้นไม้
                </button>
                <button onclick="selectModel('box')" class="model-btn p-4 glass-morphism hover:bg-white/20 transition border-2 border-transparent" id="btn-box">
                    <span class="text-3xl block mb-1">📦</span> กล่อง
                </button>
            </div>
            <button id="start-ar-btn" class="w-full bg-white text-gray-900 font-bold py-4 px-8 rounded-2xl shadow-xl transition-all transform hover:scale-105">
                เปิดกล้อง AR
            </button>
        </div>

        <div id="error-box" class="hidden p-6 bg-red-900/40 border border-red-500 rounded-2xl max-w-md">
            <p id="error-text" class="text-red-200 font-medium"></p>
            <p class="mt-2 text-sm text-gray-400">โปรดเปิดด้วย Chrome บน Android หรือ WebXR Viewer บน iOS</p>
        </div>
    </div>

    <!-- ส่วน UI ขณะอยู่ใน AR -->
    <div id="overlay">
        <div id="ar-ui" class="hidden h-full flex flex-col justify-between p-6">
            <div class="flex justify-between items-start pointer-events-auto">
                <div class="glass-morphism p-4 text-sm max-w-[220px]">
                    <p id="ar-instruction" class="font-medium text-white">🔍 เลื่อนกล้องหาพื้นที่เรียบ...</p>
                </div>
                <button id="exit-btn" class="bg-black/60 backdrop-blur-md p-3 px-6 rounded-full text-white border border-white/20">
                    ✕ ออก
                </button>
            </div>

            <div class="flex flex-col items-center mb-10 pointer-events-auto">
                <p id="tap-hint" class="hidden mb-4 text-white font-semibold text-sm bg-blue-600/60 px-6 py-2 rounded-full backdrop-blur-md border border-white/30 shadow-lg">
                    เจอพื้นแล้ว! แตะหน้าจอเพื่อวาง
                </p>
                <button id="place-btn" class="hidden bg-white text-gray-900 font-black py-5 px-14 rounded-full shadow-[0_0_40px_rgba(255,255,255,0.4)] text-2xl transform active:scale-95 transition-all uppercase tracking-wider">
                    วางที่นี่
                </button>
            </div>
        </div>
    </div>

    <!-- แจ้งเตือนข้อผิดพลาดขณะโหลดโมเดล -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 hidden z-[100] bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        console.log("vConsole initialized and AR module starting...");

        let scene, camera, renderer, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let selectedModelKey = 'chair';
        let currentSession = null;

        const modelUrls = {
            chair: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/SheenChair/glTF-Binary/SheenChair.glb',
            robot: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/RobotExpressive/glTF-Binary/RobotExpressive.glb',
            plant: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb',
            box: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Box/glTF-Binary/Box.glb'
        };

        async function checkCompatibility() {
            const statusMsg = document.getElementById('status-message');
            const modelSelection = document.getElementById('model-selection');

            if ('xr' in navigator) {
                try {
                    const isSupported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (isSupported) {
                        statusMsg.classList.add('hidden');
                        modelSelection.classList.remove('hidden');
                        initThreeJS();
                    } else {
                        showError("อุปกรณ์ของคุณไม่รองรับการทำงานในโหมด AR");
                    }
                } catch (e) {
                    showError("เกิดข้อผิดพลาดในการตรวจสอบ WebXR: " + e.message);
                }
            } else {
                showError("เบราว์เซอร์นี้ไม่รองรับ WebXR");
            }
        }

        function showError(msg) {
            const statusMsg = document.getElementById('status-message');
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');
            if(statusMsg) statusMsg.classList.add('hidden');
            if(errorBox) errorBox.classList.remove('hidden');
            if(errorText) errorText.innerText = msg;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const ambient = new THREE.AmbientLight(0xffffff, 2.0);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
            sunLight.position.set(1, 5, 1);
            scene.add(sunLight);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;

            // แก้ไข: ตั้งค่าประเภท Reference Space เป็น 'local' เพื่อป้องกันข้อผิดพลาด local-floor
            renderer.xr.setReferenceSpaceType('local');

            document.body.appendChild(renderer.domElement);

            reticle = new THREE.Group();
            const ringGeo = new THREE.RingGeometry(0.08, 0.1, 64).rotateX(-Math.PI / 2);
            const dotGeo = new THREE.CircleGeometry(0.015, 32).rotateX(-Math.PI / 2);

            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });

            reticle.add(new THREE.Mesh(ringGeo, material));
            reticle.add(new THREE.Mesh(dotGeo, material));

            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);

            window.selectModel = (key) => {
                selectedModelKey = key;
                document.querySelectorAll('.model-btn').forEach(btn => btn.classList.remove('border-white', 'bg-white/20', 'scale-105'));
                const targetBtn = document.getElementById(`btn-${key}`);
                if (targetBtn) targetBtn.classList.add('border-white', 'bg-white/20', 'scale-105');
                console.log("Model selected:", key);
            };

            window.selectModel('chair');

            document.getElementById('start-ar-btn').addEventListener('click', startAR);
            document.getElementById('place-btn').addEventListener('click', () => {
                if (reticle.visible) placeObject(reticle.matrix.clone());
            });
            document.getElementById('exit-btn').addEventListener('click', exitAR);
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        async function startAR() {
            console.log("Starting AR Session...");
            // แก้ไข: เพิ่ม optionalFeatures เพื่อให้ครอบคลุมการทำงาน
            const sessionInit = {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            };

            try {
                const session = await navigator.xr.requestSession('immersive-ar', sessionInit);
                currentSession = session;
                renderer.xr.setSession(session);

                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('ar-ui').classList.remove('hidden');

                session.addEventListener('select', () => {
                    if (reticle.visible) {
                        placeObject(reticle.matrix.clone());
                    }
                });

                session.addEventListener('end', () => {
                    console.log("AR Session Ended");
                    currentSession = null;
                    document.getElementById('welcome-screen').classList.remove('hidden');
                    document.getElementById('ar-ui').classList.add('hidden');
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                });

                renderer.setAnimationLoop(render);
            } catch (e) {
                console.error("AR Session Error:", e);
                showToast("เริ่ม AR ไม่สำเร็จ: " + e.message);
            }
        }

        function exitAR() {
            if (currentSession) currentSession.end();
        }

        function render(timestamp, frame) {
            if (frame && renderer && scene && camera) {
                // แก้ไข: ใช้ renderer.xr.getReferenceSpace() แทนการเรียกเองแบบดิบ
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        session.requestHitTestSource({ space: refSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource && referenceSpace) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    const placeBtn = document.getElementById('place-btn');
                    const tapHint = document.getElementById('tap-hint');
                    const instruction = document.getElementById('ar-instruction');

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);

                            placeBtn.classList.remove('hidden');
                            tapHint.classList.remove('hidden');
                            instruction.innerText = "✅ พร้อมวางวัตถุ";
                        }
                    } else {
                        reticle.visible = false;
                        placeBtn.classList.add('hidden');
                        tapHint.classList.add('hidden');
                        instruction.innerText = "🔍 กำลังสแกนหาพื้น...";
                    }
                }
                renderer.render(scene, camera);
            }
        }

        function placeObject(capturedMatrix) {
            console.log("Placing object:", selectedModelKey);
            const loader = new GLTFLoader();
            const url = modelUrls[selectedModelKey];
            const placeBtn = document.getElementById('place-btn');

            placeBtn.disabled = true;
            placeBtn.innerText = "กำลังสร้าง...";

            loader.load(url, (gltf) => {
                const model = gltf.scene;
                capturedMatrix.decompose(model.position, model.quaternion, model.scale);

                if (selectedModelKey === 'chair') model.scale.set(0.5, 0.5, 0.5);
                if (selectedModelKey === 'plant') model.scale.set(3, 3, 3);
                if (selectedModelKey === 'robot') model.scale.set(0.25, 0.25, 0.25);
                if (selectedModelKey === 'box') model.scale.set(0.15, 0.15, 0.15);

                scene.add(model);
                console.log("Object placed successfully");

                placeBtn.disabled = false;
                placeBtn.innerText = "วางที่นี่";
            },
            undefined,
            (error) => {
                console.error("Model Loading Error:", error);
                showToast("โหลดโมเดลล้มเหลว");
                placeBtn.disabled = false;
                placeBtn.innerText = "ลองอีกครั้ง";
            });
        }

        window.addEventListener('load', checkCompatibility);
    </script>
</body>
</html>
