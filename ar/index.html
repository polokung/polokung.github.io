<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic AR with MindAR & Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ar-container { width: 100vw; height: 100vh; position: relative; }
    /* สไตล์สำหรับ HTML Overlay Popup */
    #popup-overlay {
      position: absolute; display: none; background: rgba(0, 0, 0, 0.8);
      color: white; padding: 15px; border-radius: 8px; width: 250px;
      transform: translate(-50%, -100%);
      pointer-events: auto; z-index: 10;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
    }
    #popup-overlay h3 { margin: 0 0 10px 0; font-size: 16px; color: #ffcc00; }
    #popup-overlay p { margin: 0 0 10px 0; font-size: 14px; line-height: 1.4; }
    #close-btn { background: #ff4d4d; border: none; color: white; padding: 8px 10px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <div id="ar-container"></div>

  <div id="popup-overlay">
    <h3 id="popup-title">Title</h3>
    <p id="popup-desc">Description</p>
    <button id="close-btn">ปิด</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    // ดึงข้อมูล (อย่าลืมเปลี่ยน URL ข้อมูลให้ตรงกับที่คุณ Export ออกมาจาก Admin)
    async function fetchARData() {
      return {
        "ar_project_id": "001",
        "marker_url": "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/card.mind",
        "model_url": "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Duck/glTF-Binary/Duck.glb",
        "hotspots": [
          {
            "position": {
              "x": 0.7135485346222892,
              "y": 1.1744234181149698,
              "z": 0.13928315911831743
            },
            "title": "แก้ม",
            "description": "แก้มเป็ด ใกล้บริเวณปากเป็ด"
          }
        ]
      };
    }

    async function init() {
      const data = await fetchARData();

      const mindarThree = new MindARThree({
        container: document.querySelector("#ar-container"),
        imageTargetSrc: data.marker_url
      });

      const { renderer, scene, camera } = mindarThree;
      const anchor = mindarThree.addAnchor(0);

      // เพิ่มแสงสว่างให้เห็นโมเดลชัดเจน
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(0, 5, 5);
      scene.add(directionalLight);

      // โหลด Model
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(data.model_url);
      const model = gltf.scene;

      // 1. สร้าง Group หลักเพื่อมัดรวมโมเดลและ Hotspots ให้อยู่ด้วยกัน
      const arContentGroup = new THREE.Group();

      // 2. ปรับขนาดและจัดกึ่งกลางให้เป๊ะเหมือนในหน้า Admin (สำคัญมาก)
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      if (maxDim > 0) {
        const adminScale = 3 / maxDim; // สัดส่วนขนาด 3 เท่ากับหน้า Admin
        model.scale.set(adminScale, adminScale, adminScale);
        model.position.set(-center.x * adminScale, -center.y * adminScale, -center.z * adminScale);
      }
      arContentGroup.add(model);

      // 3. สร้าง Hotspots (ตอนนี้พิกัดจะทาบทับลงบนโมเดลได้ตรงเป๊ะ)
      const interactableObjects = [];
      // ขยายขนาดลูกกลมจาก 0.1 เป็น 0.25 (เผื่อโดน arScale ย่อแล้วเล็กเกินไป)
      const hotspotGeometry = new THREE.SphereGeometry(0.25, 16, 16);
      const hotspotMaterial = new THREE.MeshBasicMaterial({
        color: 0xffff00,
        transparent: true,
        opacity: 0.9,
        depthTest: false,    // ทะลุวัตถุ
        depthWrite: false    // ไม่ต้องเขียนทับความลึกของวัตถุอื่น
      });

      if (data.hotspots && data.hotspots.length > 0) {
        data.hotspots.forEach((hsData) => {
          const sphere = new THREE.Mesh(hotspotGeometry, hotspotMaterial);
          sphere.position.set(hsData.position.x, hsData.position.y, hsData.position.z);
          sphere.userData = { title: hsData.title, description: hsData.description };
          arContentGroup.add(sphere); // นำจุดสีเหลืองใส่เข้าไปในกล่องเดียวกับเป็ด
          interactableObjects.push(sphere);
        });
      }

      // 4. ย่อขนาด "ก้อนรวม" ให้พอดีกับ Marker บนหน้าจอ AR
      // ปรับตัวเลข 0.4 ให้ใหญ่/เล็ก ตามที่คุณต้องการได้เลยครับ
      const arScale = 0.4;
      arContentGroup.scale.set(arScale, arScale, arScale);

      // หมุนโมเดลให้ตั้งขึ้นเพื่อให้มองเห็นง่ายขึ้นเวลาส่องการ์ดแนวตั้งบนจอ
      // arContentGroup.rotation.x = Math.PI / 2;

      anchor.group.add(arContentGroup);

      // ระบบ Raycaster (จิ้ม Hotspot)
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const popup = document.getElementById('popup-overlay');
      let activeHotspot = null;

      window.addEventListener('pointerdown', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactableObjects);

        if (intersects.length > 0) {
          activeHotspot = intersects[0].object;
          const info = activeHotspot.userData;

          document.getElementById('popup-title').innerText = info.title;
          document.getElementById('popup-desc').innerText = info.description;
          popup.style.display = 'block';
        }
      });

      document.getElementById('close-btn').addEventListener('click', () => {
        popup.style.display = 'none';
        activeHotspot = null;
      });

      function updatePopupPosition() {
        if (activeHotspot && popup.style.display === 'block') {
          const vector = new THREE.Vector3();
          activeHotspot.getWorldPosition(vector);
          vector.project(camera);

          const x = (vector.x * .5 + .5) * window.innerWidth;
          const y = (vector.y * -.5 + .5) * window.innerHeight;

          popup.style.left = `${x}px`;
          popup.style.top = `${y}px`;
        }
      }

      await mindarThree.start();

      renderer.setAnimationLoop(() => {
        updatePopupPosition();
        renderer.render(scene, camera);
      });
    }

    init();
  </script>
</body>
</html>
