<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard: Visual Hotspot Placer</title>
  <style>
    body { margin: 0; display: flex; font-family: sans-serif; height: 100vh; overflow: hidden; }
    #canvas-container { flex: 1; position: relative; background: #333; }
    #sidebar { width: 350px; background: #f4f4f4; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; width: 100%; margin-top: 10px; border-radius: 4px; }
    button:hover { background: #0056b3; }

    /* สไตล์ปุ่ม Preview */
    #preview-btn { background: #6c757d; margin-top: 5px; }
    #preview-btn:hover { background: #5a6268; }

    #json-output { width: 100%; height: 150px; margin-top: 20px; font-family: monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="sidebar">
    <h2>AR Content Manager</h2>
    <div class="form-group">
      <label>Marker URL (.mind)</label>
      <input type="text" id="marker-url" value="https://your-server.com/markers/target-a.mind">
    </div>
    <div class="form-group">
      <label>Model URL (.glb)</label>
      <input type="text" id="model-url" value="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Box/glTF/Box.gltf">
      <button id="preview-btn">โหลดดูตัวอย่างโมเดลใหม่</button>
    </div>

    <hr>
    <h3>เพิ่ม Hotspot</h3>
    <p style="font-size: 12px; color: #555;">*ดับเบิลคลิกบนโมเดลเพื่อมาร์คจุดตำแหน่ง 3D</p>

    <div class="form-group">
      <label>ตำแหน่งที่คลิก (X, Y, Z)</label>
      <input type="text" id="current-pos" disabled placeholder="ดับเบิลคลิกบนโมเดล...">
    </div>
    <div class="form-group">
      <label>ชื่อจุด (Title)</label>
      <input type="text" id="hs-title" placeholder="เช่น หัวเทียน">
    </div>
    <div class="form-group">
      <label>รายละเอียด (Description)</label>
      <textarea id="hs-desc" rows="3"></textarea>
    </div>
    <button id="add-hs-btn">บันทึก Hotspot ปัจจุบัน</button>

    <hr>
    <button id="export-btn" style="background: #28a745;">Export JSON Schema</button>
    <textarea id="json-output" readonly></textarea>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // โครงสร้างข้อมูลที่จะ Export
    let projectData = {
      ar_project_id: "001",
      marker_url: "",
      model_url: "",
      hotspots: []
    };

    let currentPosition = null;
    let tempMarker = null;
    let loadedModel = null; // ตัวแปรเก็บโมเดลปัจจุบัน

    // --- ตั้งค่า Three.js พื้นฐาน ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x333333);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const loader = new GLTFLoader();

    // --- ฟังก์ชันสำหรับโหลดโมเดล ---
    async function loadModel(url) {
      if (!url) return;

      // ลบโมเดลเก่าและคืนหน่วยความจำก่อนโหลดใหม่
      if (loadedModel) {
        scene.remove(loadedModel);
        loadedModel.traverse((child) => {
          if (child.isMesh) {
            child.geometry.dispose();
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose());
            } else {
              child.material.dispose();
            }
          }
        });
      }

      try {
        const gltf = await loader.loadAsync(url);
        loadedModel = gltf.scene;
        scene.add(loadedModel);
        console.log("โหลดโมเดลสำเร็จ");
      } catch (error) {
        console.error("Error loading model:", error);
        alert("ไม่สามารถโหลดโมเดลได้ กรุณาตรวจสอบลิงก์ (อาจติดปัญหา CORS)");
      }
    }

    // โหลดโมเดลตั้งต้นเมื่อเปิดหน้าเว็บ
    loadModel(document.getElementById('model-url').value);

    // ทำงานเมื่อกดปุ่ม Preview
    document.getElementById('preview-btn').addEventListener('click', () => {
      const newUrl = document.getElementById('model-url').value;
      loadModel(newUrl);
    });

    // --- ระบบ Raycaster สำหรับการจิ้มโมเดล ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.addEventListener('dblclick', (event) => {
      if (!loadedModel) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(loadedModel, true);

      if (intersects.length > 0) {
        const point = intersects[0].point;
        currentPosition = { x: point.x, y: point.y, z: point.z };

        document.getElementById('current-pos').value = `x: ${point.x.toFixed(2)}, y: ${point.y.toFixed(2)}, z: ${point.z.toFixed(2)}`;

        if (tempMarker) scene.remove(tempMarker);
        const markerGeo = new THREE.SphereGeometry(0.05, 16, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        tempMarker = new THREE.Mesh(markerGeo, markerMat);
        tempMarker.position.copy(point);
        scene.add(tempMarker);
      }
    });

    // --- จัดการ UI และ Data ---
    document.getElementById('add-hs-btn').addEventListener('click', () => {
      if (!currentPosition) return alert("กรุณาดับเบิลคลิกบนโมเดลเพื่อเลือกตำแหน่งก่อน");

      const title = document.getElementById('hs-title').value;
      const desc = document.getElementById('hs-desc').value;

      if (!title) return alert("กรุณาใส่ชื่อจุด (Title)");

      projectData.hotspots.push({
        position: { ...currentPosition },
        title: title,
        description: desc
      });

      tempMarker.material.color.setHex(0xffff00);
      tempMarker = null;
      currentPosition = null;

      document.getElementById('current-pos').value = "";
      document.getElementById('hs-title').value = "";
      document.getElementById('hs-desc').value = "";

      alert("บันทึก Hotspot สำเร็จ!");
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      projectData.marker_url = document.getElementById('marker-url').value;
      projectData.model_url = document.getElementById('model-url').value;

      const jsonString = JSON.stringify(projectData, null, 2);
      document.getElementById('json-output').value = jsonString;
    });

    // --- Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
