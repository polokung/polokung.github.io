<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Education - Marker Based</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <script>
        //////////////////////////////////////////////////////////////////////////////
        // 1. การตั้งค่า Scene, Camera และ Renderer
        //////////////////////////////////////////////////////////////////////////////
        const scene = new THREE.Scene();
        
        // เพิ่มแสงเพื่อให้โมเดลดูมีมิติ (สำคัญมากสำหรับการศึกษา)
        const ambientLight = new THREE.AmbientLight(0xcccccc, 1.0);
        scene.add(ambientLight);

        const camera = new THREE.Camera();
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({
            antialiasing: true,
            alpha: true // ทำให้พื้นหลังโปร่งใสเพื่อเห็นภาพจากกล้อง
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        //////////////////////////////////////////////////////////////////////////////
        // 2. การตั้งค่า AR.js Toolkit
        //////////////////////////////////////////////////////////////////////////////
        const arToolkitSource = new THREEx.ArToolkitSource({
            sourceType: 'webcam',
        });

        arToolkitSource.init(() => {
            setTimeout(() => {
                arToolkitSource.onResizeElement();
                arToolkitSource.copyElementSizeTo(renderer.domElement);
            }, 2000);
        });

        const arToolkitContext = new THREEx.ArToolkitContext({
            cameraParametersUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat',
            detectionMode: 'mono',
        });

        arToolkitContext.init(() => {
            camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
        });

        //////////////////////////////////////////////////////////////////////////////
        // 3. การสร้าง Marker และวางโมเดล 3D
        //////////////////////////////////////////////////////////////////////////////
        // ในที่นี้จะใช้ "HIRO Marker" ซึ่งเป็น Marker มาตรฐานของ AR.js
        const markerRoot = new THREE.Group();
        scene.add(markerRoot);
        
        const arMarkerControls = new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
            type: 'pattern',
            patternUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/patt.hiro',
        });

        // สร้างโมเดลจำลอง (เช่น ลูกบาศก์สีเขียว) แทนชิ้นส่วนการศึกษา
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshNormalMaterial({
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.y = 0.5; // วางให้ลอยอยู่เหนือ Marker เล็กน้อย
        markerRoot.add(mesh);

        //////////////////////////////////////////////////////////////////////////////
        // 4. Render Loop
        //////////////////////////////////////////////////////////////////////////////
        function animate() {
            requestAnimationFrame(animate);
            if (arToolkitSource.ready) {
                arToolkitContext.update(arToolkitSource.domElement);
            }
            // หมุนโมเดลเบาๆ เพื่อให้ดูน่าสนใจ
            mesh.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // จัดการเมื่อมีการเปลี่ยนขนาดหน้าจอ
        window.addEventListener('resize', () => {
            arToolkitSource.onResizeElement();
            arToolkitSource.copyElementSizeTo(renderer.domElement);
        });
    </script>
</body>
</html>
