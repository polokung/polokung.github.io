<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR GitHub Pages - Stable</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #info-ui {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; z-index: 1000; pointer-events: none;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    
    <div id="info-ui">ส่องไปที่ Hiro Marker</div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="helmetModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            <a-entity 
                gltf-model="#helmetModel" 
                scale="0.5 0.5 0.5" 
                position="0 0.5 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
            </a-entity>
            
            <a-text 
                value="Damaged Helmet Study" 
                position="0 1.2 0" 
                align="center" 
                color="#FFFFFF" 
                width="3">
            </a-text>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
