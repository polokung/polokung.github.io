<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Fixed AR.js Marker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <script>
        // 1. ตั้งค่าพื้นฐาน
        const scene = new THREE.Scene();
        const camera = new THREE.Camera();
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. ตั้งค่า AR Toolkit (ตัวจัดการกล้อง)
        const arToolkitSource = new THREEx.ArToolkitSource({
            sourceType: 'webcam',
        });

        arToolkitSource.init(function onReady(){
            setTimeout(() => {
                onResize();
            }, 2000);
        });

        const arToolkitContext = new THREEx.ArToolkitContext({
            cameraParametersUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat',
            detectionMode: 'mono',
        });

        arToolkitContext.init(function onCompleted(){
            camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
        });

        // 3. สร้าง Marker (ใช้ Hiro Marker)
        const markerRoot = new THREE.Group();
        scene.add(markerRoot);
        new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
            type: 'pattern',
            patternUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/patt.hiro',
        });

        // 4. เพิ่มวัตถุ (Cube) ลงใน Marker
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshNormalMaterial({ transparent: true, opacity: 0.8 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.y = 0.5; 
        markerRoot.add(mesh);

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            if (arToolkitSource.ready === false) return;
            arToolkitContext.update(arToolkitSource.domElement);
            mesh.rotation.y += 0.05;
            renderer.render(scene, camera);
        }
        animate();

        // จัดการหน้าจอ
        function onResize(){
            arToolkitSource.onResizeElement();
            arToolkitSource.copyElementSizeTo(renderer.domElement);
            if(arToolkitContext.arController !== null){
                arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
            }
        }
        window.addEventListener('resize', function(){ onResize(); });
    </script>
</body>
</html>
