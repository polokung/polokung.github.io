```html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Solar System Learning</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Tahoma', sans-serif;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- UI Overlay for Instructions -->
    <div class="info-panel">
        <h2 style="margin:0">ระบบสุริยะ VR</h2>
        <p>ใช้เมาส์ลากเพื่อมองรอบๆ | WASD เพื่อเคลื่อนที่</p>
        <p>กดปุ่ม VR บนมือถือเพื่อเข้าสู่โหมดแว่น VR</p>
    </div>

    <a-scene>
        <!-- Assets Management -->
        <a-assets>
            <!-- เราจะใช้สีและเอฟเฟกต์แทนรูปภาพเพื่อความรวดเร็วในการโหลดไฟล์เดียว -->
        </a-assets>

        <!-- ท้องฟ้าและดวงดาว (Starry Sky) -->
        <a-sky color="#000000"></a-sky>
        <a-entity id="stars" position="0 0 0">
            <!-- สุ่มจุดสีขาวแทนดวงดาวล้อมรอบ -->
            <a-entity particle-system="preset: stars; particleCount: 5000"></a-entity>
        </a-entity>
        
        <!-- แสงสว่างจากใจกลางดวงอาทิตย์ -->
        <a-light type="point" intensity="2" distance="100" position="0 0 0"></a-light>
        <a-light type="ambient" intensity="0.2"></a-light>

        <!-- ดวงอาทิตย์ (The Sun) -->
        <a-sphere id="sun" position="0 0 0" radius="5" color="#FFCC00" 
                  material="shader: flat; emissive: #FFCC00; emissiveIntensity: 1"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
            <a-text value="Sun" position="0 6 0" align="center" scale="5 5 5"></a-text>
        </a-sphere>

        <!-- กลุ่มดาวเคราะห์ (Planets) -->
        
        <!-- พุธ (Mercury) -->
        <a-entity id="orbit-mercury" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
            <a-sphere position="8 0 0" radius="0.4" color="#A5A5A5"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
                <a-text value="Mercury" position="0 0.8 0" align="center" scale="0.5 0.5 0.5"></a-text>
            </a-sphere>
        </a-entity>

        <!-- ศุกร์ (Venus) -->
        <a-entity id="orbit-venus" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
            <a-sphere position="12 0 0" radius="0.9" color="#E3BB76"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
                <a-text value="Venus" position="0 1.2 0" align="center" scale="0.6 0.6 0.6"></a-text>
            </a-sphere>
        </a-entity>

        <!-- โลก (Earth) -->
        <a-entity id="orbit-earth" animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
            <a-sphere position="16 0 0" radius="1" color="#2271B3"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
                <a-text value="Earth" position="0 1.5 0" align="center" scale="0.7 0.7 0.7"></a-text>
                <!-- ดวงจันทร์ (Moon) -->
                <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
                    <a-sphere position="1.5 0 0" radius="0.2" color="#D3D3D3"></a-sphere>
                </a-entity>
            </a-sphere>
        </a-entity>

        <!-- อังคาร (Mars) -->
        <a-entity id="orbit-mars" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
            <a-sphere position="20 0 0" radius="0.6" color="#E27B58"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
                <a-text value="Mars" position="0 1 0" align="center" scale="0.6 0.6 0.6"></a-text>
            </a-sphere>
        </a-entity>

        <!-- พฤหัสบดี (Jupiter) -->
        <a-entity id="orbit-jupiter" animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear">
            <a-sphere position="28 0 0" radius="2.5" color="#D39C7E"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                <a-text value="Jupiter" position="0 3 0" align="center" scale="1.5 1.5 1.5"></a-text>
            </a-sphere>
        </a-entity>

        <!-- เสาร์ (Saturn) -->
        <a-entity id="orbit-saturn" animation="property: rotation; to: 0 360 0; loop: true; dur: 35000; easing: linear">
            <a-entity position="38 0 0">
                <a-sphere radius="2.2" color="#C5AB6E"
                          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                    <a-text value="Saturn" position="0 2.8 0" align="center" scale="1.2 1.2 1.2"></a-text>
                </a-sphere>
                <!-- วงแหวน (Rings) -->
                <a-ring color="#A49173" radius-inner="2.5" radius-outer="4" rotation="90 0 0" opacity="0.6"></a-ring>
            </a-entity>
        </a-entity>

        <!-- ยูเรนัส (Uranus) -->
        <a-entity id="orbit-uranus" animation="property: rotation; to: 0 360 0; loop: true; dur: 45000; easing: linear">
            <a-sphere position="48 0 0" radius="1.5" color="#B5E3E3"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
                <a-text value="Uranus" position="0 2 0" align="center" scale="1 1 1"></a-text>
            </a-sphere>
        </a-entity>

        <!-- เนปจูน (Neptune) -->
        <a-entity id="orbit-neptune" animation="property: rotation; to: 0 360 0; loop: true; dur: 55000; easing: linear">
            <a-sphere position="58 0 0" radius="1.4" color="#4B70DD"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
                <a-text value="Neptune" position="0 2 0" align="center" scale="1 1 1"></a-text>
            </a-sphere>
        </a-entity>

        <!-- กล้อง (Camera) -->
        <a-entity position="0 15 40" rotation="-20 0 0">
            <a-camera wasd-controls="fly: true; acceleration: 100"></a-camera>
        </a-entity>

    </a-scene>

    <script>
        // สร้างระบบดวงดาวพื้นหลังแบบสุ่มด้วย JS เพื่อลดขนาดไฟล์
        window.onload = function() {
            const scene = document.querySelector('a-scene');
            for (let i = 0; i < 1000; i++) {
                const star = document.createElement('a-sphere');
                const x = (Math.random() - 0.5) * 300;
                const y = (Math.random() - 0.5) * 300;
                const z = (Math.random() - 0.5) * 300;
                star.setAttribute('position', `${x} ${y} ${z}`);
                star.setAttribute('radius', Math.random() * 0.2);
                star.setAttribute('color', '#FFFFFF');
                star.setAttribute('shader', 'flat');
                scene.appendChild(star);
            }
        };
    </script>
</body>
</html>

```
