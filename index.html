<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Hit Test with Three.js</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: none; /* แสดงเมื่อเริ่ม AR */
        }
        #place-button {
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        #place-button:active {
            background-color: #0056b3;
        }
        #info-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="info-text">กำลังโหลดระบบ AR...</div>
    
    <div id="ui-container">
        <button id="place-button">วางวัตถุตรงนี้</button>
    </div>

    <!-- โหลด Three.js และโมดูลที่จำเป็น -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let container;
        let camera, scene, renderer;
        let reticle; // ตัวชี้ตำแหน่งบนพื้น
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let currentModel = null;

        const loader = new GLTFLoader();
        const infoText = document.getElementById('info-text');
        const uiContainer = document.getElementById('ui-container');
        const placeButton = document.getElementById('place-button');

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // ตั้งค่า Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // เพิ่มปุ่มเริ่ม AR
            const arButton = ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            document.body.appendChild(arButton);

            // สร้าง Reticle (วงกลมเล็งตำแหน่ง)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial()
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // โหลดโมเดล .glb (ตัวอย่างเป็นโมเดลกล่องถ้าหาไฟล์ไม่เจอ)
            // คุณสามารถเปลี่ยน URL เป็นไฟล์ของคุณเองได้ที่นี่
            const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb';
            
            loader.load(modelUrl, (gltf) => {
                currentModel = gltf.scene;
                currentModel.scale.set(0.2, 0.2, 0.2); // ปรับขนาดโมเดล
                infoText.innerText = "ส่องกล้องลงบนพื้นราบเพื่อเริ่ม";
            }, undefined, (error) => {
                console.error('โหลดโมเดลไม่สำเร็จ:', error);
                // สร้างกล่องสำรองถ้าโหลดไฟล์ไม่ได้
                const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                currentModel = new THREE.Mesh(geometry, material);
                infoText.innerText = "ใช้โมเดลสำรอง (กล่อง)";
            });

            // เหตุการณ์เมื่อกดปุ่มวางวัตถุ
            placeButton.addEventListener('click', () => {
                if (reticle.visible && currentModel) {
                    const modelCopy = currentModel.clone();
                    modelCopy.position.setFromMatrixPosition(reticle.matrix);
                    scene.add(modelCopy);
                    infoText.innerText = "วางวัตถุแล้ว!";
                    setTimeout(() => { infoText.innerText = "ส่องหาพื้นที่เพื่อวางเพิ่ม"; }, 2000);
                }
            });

            // ตรวจสอบการเข้าสู่โหมด AR
            renderer.xr.addEventListener('sessionstart', () => {
                uiContainer.style.display = 'block';
            });
            renderer.xr.addEventListener('sessionend', () => {
                uiContainer.style.display = 'none';
                infoText.innerText = "จบการทำงาน AR";
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // ขอ Hit Test Source ครั้งแรก
                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                // ประมวลผล Hit Test เพื่อหาพื้นราบ
                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        
                        if (placeButton.disabled) placeButton.disabled = false;
                        infoText.innerText = "พร้อมวางวัตถุ";
                    } else {
                        reticle.visible = false;
                        infoText.innerText = "กำลังหาพื้นผิว...";
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
